name: Frontend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'Source/Editor/Frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Source/Editor/Frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: Source/Editor/Frontend/package-lock.json
          
      - name: Build Web Interface
        run: |
          cd Source/Editor/Frontend
          npm install
          npm run build
          
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-interface
          path: Bin/UI/
